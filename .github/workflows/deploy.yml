name: ci-deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
        env:
          REDIS_ARGS: "--requirepass faultline-dev-password"
        ports:
          - 6379:6379
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: faultline-dev-password
      APP_ENV: development
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            uv run python -c "from falkordb import FalkorDB; FalkorDB(host='127.0.0.1', port=6379, password='faultline-dev-password').connection.ping()" && exit 0
            sleep 2
          done
          exit 1
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SITE_HOST: ${{ vars.SITE_HOST }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy with SSM Run Command
        run: |
          set -euo pipefail
          script="set -e
          if [ ! -d /opt/faultline/.git ]; then git clone --quiet https://github.com/${{ github.repository }}.git /opt/faultline; fi
          cd /opt/faultline
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          SITE_HOST=$SITE_HOST bash deploy/deploy.sh"
          params=$(jq -n --arg s "$script" '{commands: ($s | split("\n") | map(sub("^ +"; ""))), executionTimeout: ["1800"]}')
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "faultline ${GITHUB_SHA::7}" \
            --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $cmd"
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -60
          echo "status: $status"
          [ "$status" = "Success" ]

      - name: Smoke check
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://$SITE_HOST/api/faultline/health" && exit 0
            sleep 5
          done
          exit 1
