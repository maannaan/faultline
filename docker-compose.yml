services:
  falkordb:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: faultline-falkordb
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD} --appendonly yes"
      REDISCLI_AUTH: "${FALKORDB_PASSWORD}"
    volumes:
      - graph_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: faultline-api
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_KEYS: ${AUTH_KEYS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      POLICY_VERSION: ${POLICY_VERSION:-memory-policy-v1}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-1}
      MAX_NOTE_CHARS: ${MAX_NOTE_CHARS:-8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3010}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  graph_data:
